<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | AI Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {margin:0;padding:0;box-sizing:border-box;}
    body {
      font-family:"Inter",sans-serif;
      background:#0b0e11;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    video.background-video{
      position:fixed;top:0;left:0;width:100%;height:100vh;
      object-fit:cover;z-index:-2;
    }

    .overlay{
      position:fixed;top:0;left:0;width:100%;height:100vh;
      background:rgba(0,0,0,0.55);
      backdrop-filter:blur(10px);
      z-index:-1;
    }

    .login-box {
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:16px;
      padding:40px 35px;
      width:100%;
      max-width:420px;
      text-align:center;
    }

    h1 {
      font-size:28px;
      font-weight:700;
      margin-bottom:12px;
    }
    h1 span{color:#990000;}

    p.desc {
      font-size:14px;
      color:#ccc;
      margin-bottom:20px;
    }

    input {
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      margin-bottom:15px;
      background:rgba(255,255,255,0.12);
      color:#fff;
      font-size:15px;
    }

    input::placeholder{color:#ccc;}

    button {
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#990000;
      color:#fff;
      font-weight:600;
      font-size:16px;
      cursor:pointer;
      transition:0.25s;
    }
    button:hover {background:#b30000;}

    .message {
      margin-bottom:15px;
      font-size:14px;
      padding:10px;
      border-radius:8px;
    }
    .message.error {
      background:rgba(255,0,0,0.1);
      color:#ff6666;
      border:1px solid rgba(255,0,0,0.3);
    }
    .message.success {
      background:rgba(0,255,0,0.1);
      color:#90ee90;
      border:1px solid rgba(0,255,0,0.3);
    }

    .bottom-text {
      margin-top:18px;
      font-size:13px;
      color:#ccc;
    }

    a {color:#00c6ff;text-decoration:none;}
  </style>
</head>

<body>
  <video autoplay muted loop playsinline class="background-video">
    <source src="https://cdn.pixabay.com/video/2023/03/22/155718-810722623_large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="login-box">
    <h1>Reset <span>Password</span></h1>
    <p class="desc">Enter OTP and set a new password</p>

    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="otp" placeholder="Enter OTP" required>
      <input type="password" name="password" placeholder="New password" required>
      <input type="password" name="confirm_password" placeholder="Confirm password" required>
      <button type="submit">Reset Password</button>
    </form>

        <p id="otp-timer" class="bottom-text">
        OTP expires in <span id="time">05:00</span>
        </p>

        <p class="bottom-text">
        Didn’t receive OTP?
        <a href="{% url 'resend_otp' %}" id="resend-btn" style="pointer-events:none;opacity:0.5;">
            Resend OTP
        </a>
    </p>

  </div>
  <script>
  let duration = 300; // 5 minutes in seconds
  const timerDisplay = document.getElementById("time");
  const resendBtn = document.getElementById("resend-btn");

  function startTimer() {
    let timer = duration;

    const interval = setInterval(() => {
      const minutes = Math.floor(timer / 60);
      const seconds = timer % 60;

      timerDisplay.textContent =
        `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

      if (--timer < 0) {
        clearInterval(interval);
        timerDisplay.textContent = "Expired";

        resendBtn.style.pointerEvents = "auto";
        resendBtn.style.opacity = "1";
      }
    }, 1000);
  }

  startTimer();
</script>

</body>
</html>
