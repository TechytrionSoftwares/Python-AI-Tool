{% include "adminpanel/header.html" %}

<div class="layout">
  {% include "adminpanel/sidebar.html" %}

  <main class="main">
    <h2 class="top-head">Create Subscription</h2>

    <div class="table-box">
      <form method="post" class="form-box" id="subscription-form">
        {% csrf_token %}

        <div class="form-row">
          <label>Name</label>
          <input type="text" name="name" required>
        </div>

        <div class="form-row">
          <label>Description</label>
          <div id="editor" style="height: 300px;"></div>
        <input type="hidden" name="description" id="id_description">
        </div>

        <div class="form-row">
          <label>Price</label>
          <input type="number" step="0.01" name="price" required>
        </div>

        <div class="form-row">
          <label>Billing Type</label>
          <select name="billing_type" required>
            <!-- <option value="one_time">One Time</option> -->
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="form-row">
          <label>Status</label>
          <select name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">
          Create Subscription
        </button>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    var quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: 'Write subscription description...',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'code-block'],
          ['clean']
        ]
      }
    });

    document.getElementById('subscription-form').onsubmit = function () {
      document.getElementById('id_description').value =
        quill.root.innerHTML;
    };

  });

  // On submit, copy HTML to hidden input
 document.getElementById('subscription-form').onsubmit = function () {
    document.getElementById('id_description').value =
      quill.root.innerHTML;
  };
</script>
